<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact | Mr Erwan Sddirects</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Georgia, serif;
}

body{
  background:#f3f1ef;
  overflow-x:hidden;
  animation:fadeIn .6s ease;
}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 60px;
}

.logo{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo-circle{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#7a0000;
}

nav a{
  margin:0 15px;
  text-decoration:none;
  color:#000;
  font-size:15px;
}

nav a.active{
  color:#7a0000;
  font-weight:bold;
}

/* ================= CONTACT ================= */
.contact-wrapper{
  max-width:1000px;
  margin:80px auto;
  display:flex;
  gap:60px;
  padding:0 40px;
}

.contact-left{
  flex:1;
}

.contact-left h1{
  font-size:42px;
  margin-bottom:20px;
}

.contact-left p{
  line-height:1.8;
  color:#555;
}

.contact-right{
  flex:1;
  background:#ffffff;
  padding:40px;
  border-radius:25px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.contact-right input,
.contact-right textarea{
  width:100%;
  padding:12px 15px;
  margin-bottom:20px;
  border-radius:15px;
  border:1px solid #ccc;
  font-size:14px;
}

.contact-right textarea{
  resize:none;
  height:120px;
}

.contact-right button{
  background:#7a0000;
  color:#fff;
  border:none;
  padding:12px 30px;
  border-radius:25px;
  font-size:14px;
  cursor:not-allowed;
  opacity:.7;
}

/* ================= DECOR ================= */
.circle-top{
  position:absolute;
  top:-120px;
  right:-120px;
  width:260px;
  height:260px;
  border-radius:50%;
  background:#7a0000;
  z-index:-1;
}


/* ================= ANIMATION ================= */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-circle"></div>
    <div>
      <strong>Mr Erwan Sddirects</strong><br>
      <small>An a Creator</small>
    </div>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="gallery.html">Gallery</a>
    <a href="creation.html">Creation</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<section class="contact-wrapper">
  <div class="contact-left">
    <h1>Contact Me</h1>
    <p>
      Jika ingin berdiskusi, berkolaborasi, atau sekadar menyampaikan pesan,
      silakan tinggalkan pesan Anda melalui form di samping.
    </p>
  </div>

  <div class="contact-right">
    <input type="text" placeholder="Your Name" disabled>
    <input type="email" placeholder="Your Email" disabled>
    <textarea placeholder="Your Message" disabled></textarea>
    <button>Send Message</button>
  </div>
</section>


<div class="circle-bottom"></div>

</body>
</html>
